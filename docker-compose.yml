# Local stack: API + UI in DEMO MODE (FAKE AIRFLOW (DEMO) in-process, MOCK LLM unless ANTHROPIC_API_KEY is set,
# DRY_RUN). Copy .env.example to .env to change settings; never commit real credentials.
#
#   docker compose up --build        -> API http://localhost:8000 , UI http://localhost:8501
services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/triage.db
      UI_BASE_URL: http://localhost:8501
    ports:
      - "8000:8000"
    volumes:
      - triage-data:/data

  ui:
    build: .
    command: ["streamlit", "run", "frontend/streamlit_app.py", "--server.address", "0.0.0.0",
              "--server.port", "8501", "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    environment:
      TRIAGE_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  triage-data:
