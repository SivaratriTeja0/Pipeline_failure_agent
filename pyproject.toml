[project]
name = "pipeline-failure-triage"
version = "0.1.0"
description = "Universal Pipeline Failure Triage & Human-Approved Self-Healing Agent (V1: Airflow)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    # starlette's TestClient (used only to run FAKE AIRFLOW in-process) nudges toward httpx2.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
